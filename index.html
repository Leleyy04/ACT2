<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <!-- Bootstrap CSS para sa mga pre-made styles at responsive design -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS natin -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow-lg p-4" style="width: 100%; max-width: 500px;">
            <h2 class="text-center mb-4">Sign Up</h2>
            <form class="needs-validation" novalidate>
                <!-- First Name field with validation -->
                <div class="mb-3">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="firstName" required>
                    <div class="invalid-feedback">
                        Please enter your first name.
                    </div>
                </div>
                
                <!-- Last Name field with validation -->
                <div class="mb-3">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lastName" required>
                    <div class="invalid-feedback">
                        Please enter your last name.
                    </div>
                </div>
                
                <!-- Email field with validation -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required>
                    <div class="invalid-feedback">
                        Please enter a valid email.
                    </div>
                </div>
                
                <!-- Password field with validation -->
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required>
                    <div class="invalid-feedback">
                        Please enter a password.
                    </div>
                </div>
                
                <!-- Confirm Password field with validation -->
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" required>
                    <div class="invalid-feedback">
                        Passwords must match.
                    </div>
                </div>
                
                <!-- Submit button with primary color -->
                <button type="submit" class="btn btn-primary w-100 mt-3">Sign Up</button>
                
                <!-- Link to login if may account na -->
                <p class="text-center mt-3">
                    Already have an account? <a href="#">Log In</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS and validation script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // JavaScript para sa form validation
        (function() {
            'use strict'
            
            // Kunin lahat ng forms na may needs-validation class
            var forms = document.querySelectorAll('.needs-validation')
            
            // Loop through each form at i-prevent ang submission kung invalid
            Array.prototype.slice.call(forms)
                .forEach(function(form) {
                    form.addEventListener('submit', function(event) {
                        if (!form.checkValidity()) {
                            event.preventDefault()
                            event.stopPropagation()
                        }
                        
                        form.classList.add('was-validated')
                    }, false)
                })
        })()
        
        // Additional validation para icheck kung match ang password at confirm password
        document.querySelector('form').addEventListener('submit', function(e) {
            const password = document.getElementById('password').value
            const confirmPassword = document.getElementById('confirmPassword').value
            
            if (password !== confirmPassword) {
                e.preventDefault()
                e.stopPropagation()
                document.getElementById('confirmPassword').classList.add('is-invalid')
            }
        })
    </script>
</body>

</html>
